services:
  - type: web
    name: xololo-staging
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: yarn install --production=false --ignore-scripts && (npx patch-package || echo "patch-package warning, continuing") && NODE_OPTIONS="--max-old-space-size=1536" yarn build
    startCommand: yarn start
    healthCheckPath: /_health
    envVars:
      - key: NODE_VERSION
        value: "22.22.0"
      - key: NODE_ENV
        value: production
      - key: REACT_APP_ENV
        value: production
      - key: REACT_APP_MARKETPLACE_ROOT_URL
        sync: false
      - key: REACT_APP_MARKETPLACE_NAME
        value: Xololo
      - key: REACT_APP_SHARETRIBE_SDK_CLIENT_ID
        sync: false
      - key: SHARETRIBE_SDK_CLIENT_SECRET
        sync: false
      - key: REACT_APP_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: REACT_APP_MAPBOX_ACCESS_TOKEN
        sync: false
      - key: REACT_APP_SHARETRIBE_USING_SSL
        value: "true"
      - key: SERVER_SHARETRIBE_TRUST_PROXY
        value: "true"
      - key: REACT_APP_CSP
        value: report
      - key: BASIC_AUTH_USERNAME
        sync: false
      - key: BASIC_AUTH_PASSWORD
        sync: false
      # XOLOLO: Sharetribe Integration API — para queries user-by-slug
      # y featured-stores en el server.
      - key: SHARETRIBE_INTEGRATION_CLIENT_ID
        sync: false
      - key: SHARETRIBE_INTEGRATION_CLIENT_SECRET
        sync: false
      # XOLOLO: Cloudflare R2 — uploads de logo/banner del storefront.
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: xololo-media
      - key: R2_PUBLIC_BASE_URL
        value: https://media.xololo.mx
      # XOLOLO: Skydropx PRO — cotización y generación de guías de envío.
      # Sandbox host: sb-pro.skydropx.com  |  Prod host: api-pro.skydropx.com
      # Configurar CLIENT_ID / CLIENT_SECRET en el dashboard de Render.
      - key: SKYDROPX_CLIENT_ID
        sync: false
      - key: SKYDROPX_CLIENT_SECRET
        sync: false
      - key: SKYDROPX_ENV
        value: sandbox
      - key: SKYDROPX_HOST
        value: sb-pro.skydropx.com
      # XOLOLO: token compartido con Skydropx para autenticar los
      # webhooks entrantes (tracking events). Configurar en Render y
      # en el dashboard de Skydropx > Conexiones > Webhooks.
      - key: SKYDROPX_WEBHOOK_TOKEN
        sync: false
      # XOLOLO: Resend para emails dual-brand (D.9 + email branding).
      # Requiere validar dominio xololo.mx en Resend dashboard antes de
      # que los emails salgan sin caer en spam.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM_NAME
        value: Xololo
      - key: EMAIL_FROM_ADDRESS
        value: noreply@xololo.mx
      - key: EMAIL_REPLY_TO
        value: soporte@xololo.mx
      # XOLOLO Track C: Stripe Billing — suscripción de sellers (docs/SUBSCRIPTIONS_V1.md §3.5).
      # Cuenta Stripe SEPARADA de la de Connect. Mientras el track no esté
      # terminado (checkout + webhook + gating), usar aquí sólo la key de
      # TEST (sk_test_...) — nunca la live hasta que esto esté probado.
      - key: STRIPE_SECRET_KEY
        sync: false
      # Se usa a partir del roadmap #5 (webhook de Stripe Billing).
      - key: STRIPE_BILLING_WEBHOOK_SECRET
        sync: false
