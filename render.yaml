services:
  - type: web
    name: xololo-staging
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: yarn install && yarn build
    startCommand: yarn start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22.22.0"
      - key: NODE_ENV
        value: production
      - key: REACT_APP_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: REACT_APP_MARKETPLACE_ROOT_URL
        sync: false
      - key: REACT_APP_MARKETPLACE_NAME
        value: Xololo
      - key: REACT_APP_SHARETRIBE_SDK_CLIENT_ID
        sync: false
      - key: SHARETRIBE_SDK_CLIENT_SECRET
        sync: false
      - key: REACT_APP_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: REACT_APP_MAPBOX_ACCESS_TOKEN
        sync: false
      - key: REACT_APP_SHARETRIBE_USING_SSL
        value: "true"
      - key: SERVER_SHARETRIBE_TRUST_PROXY
        value: "true"
      - key: REACT_APP_CSP
        value: report
      - key: BASIC_AUTH_USERNAME
        sync: false
      - key: BASIC_AUTH_PASSWORD
        sync: false
